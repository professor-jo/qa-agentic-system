[project]
name = "qa_team"
version = "0.1.0"
description = "A CrewAI QA team: test suite generation, PR review, and change reports for any Git repo"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.scripts]
qa_team = "qa_team.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_team"]

[tool.crewai]
type = "crew"
