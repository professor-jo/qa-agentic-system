[project]
name = "qa_team"
version = "0.1.0"
description = "Agentic QA: an AI team that analyzes, fixes, tests and reports on your Git repositories"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
qa_team = "qa_team.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_team"]

[tool.crewai]
type = "crew"
